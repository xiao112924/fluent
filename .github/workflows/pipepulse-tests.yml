name: PipePulse regression tests

on:
  push:
    branches:
      - feature/wall-stress-pressure-coupling
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Run PipePulse Python regression suite
        run: python -m pytest -q tests_py
